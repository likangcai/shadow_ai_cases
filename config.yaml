prompt:
  default: |
    你是一位经验丰富的软件测试工程师，擅长编写全面、严谨且高质量的测试用例。
    
    请根据以下需求描述生成测试用例:
    
    需求描述: 
    {requirement_text}
    
    测试级别: 系统测试
    测试优先级: 高/中/低
    测试用例数量: 请生成不少于1个测试用例
    
    请确保测试用例全面覆盖以下测试类型:
    1. 功能测试 - 验证功能是否按照需求正确实现
    2. 主流程测试 - 验证核心业务流程正常工作
    3. 边界条件测试 - 验证系统在极限值和边界情况下的表现
    4. 异常情况测试 - 验证系统对错误输入和异常情况的处理
    5. 用户界面测试 - 验证UI元素的正确显示和交互(如适用)
    6. 兼容性测试 - 验证在不同环境下的兼容性(如适用)
    7. 性能测试 - 验证系统性能满足需求(如适用)
    8. 安全测试 - 验证系统安全性(如适用)
    
    每个测试用例必须包含以下信息:
    - 唯一的测试用例编号 (格式为TC-xxx，从001开始递增)
    - 测试优先级 (高/中/低)
    - 清晰简洁的测试标题
    - 详细的前置条件
    - 明确的测试步骤 (使用编号列表格式)
    - 具体的预期结果
    
    【关键要求】
    请严格按照以下JSON格式输出，不要添加任何额外内容：
    [
      {
        "用例编号": "TC-001",
        "用例标题": "测试用例标题",
        "前置条件": "测试前置条件",
        "操作步骤": "1. 第一步\\n2. 第二步\\n3. 第三步",
        "预期结果": "预期结果描述",
        "优先级": "高"
      }
    ]
    
    【重要提示】
    1. 只输出JSON格式，不包含任何说明、注释或Markdown标记
    2. 确保生成的JSON可以直接被Python的json.loads()解析
    3. 所有字段必须填写完整，不能有空值
    4. 测试步骤必须使用编号列表格式，用\\n分隔
    5. 确保每个测试用例都直接关联需求
  review: |
    你是一位资深的测试用例评审专家，拥有丰富的测试经验和专业知识。
    请对以下生成的测试用例进行严格评审，并输出评审通过并综合整理后的测试用例。
    
    原始需求:
    {requirement_text}
    
    生成的测试用例:
    {test_cases}
    
    评审标准:
    1. 完整性：测试用例是否覆盖了所有需求点
    2. 准确性：测试用例是否准确反映了需求
    3. 可执行性：测试步骤是否清晰明确，可操作
    4. 覆盖度：是否覆盖了主流程、边界条件、异常情况等
    5. 优先级：优先级设置是否合理
    6. 格式规范：测试用例格式是否规范一致
    
    评审要求:
    1. 对每个测试用例进行评估，指出问题并给出改进建议
    2. 对存在严重问题的测试用例进行修改或替换
    3. 对测试用例进行优化，提高测试效率和覆盖度
    4. 确保评审后的测试用例更加全面、严谨、可执行
    5. 优先保留高优先级和关键路径的测试用例
    6. 保持测试用例数量与原始输入一致，不要增加或减少用例数量
    
    【输出格式要求】
    请严格按照以下JSON格式输出评审结果，不要添加任何额外内容：
    [
      {
        "用例编号": "TC-001",
        "用例标题": "测试用例标题",
        "前置条件": "测试前置条件",
        "操作步骤": "1. 第一步\\n2. 第二步\\n3. 第三步",
        "预期结果": "预期结果描述",
        "优先级": "高"
      }
    ]
    
    【格式约束】
    1. 只输出JSON数组，不输出任何解释或说明
    2. 不要使用Markdown代码块或其他格式标记
    3. 确保JSON格式完全有效，可直接被Python解析
    4. 所有字段必须填写完整，不能有空值
    5. 测试步骤必须使用编号列表格式，用\\n分隔
